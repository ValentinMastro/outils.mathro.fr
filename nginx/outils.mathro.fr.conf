# Vhost nginx pour outils.mathro.fr.
#
# Version « bootstrap » : sert le site en HTTP, sans TLS. `deploy.sh`
# l'installe dans /etc/nginx/conf.d/ si absent, puis lance `certbot --nginx`
# pour obtenir le certificat et faire basculer ce fichier en HTTPS (bloc 443
# + redirection 80 → 443, ajoutés par Certbot). Ce fichier versionné n'est
# donc utilisé que lors du tout premier déploiement sur une machine.
server {
    listen 80;
    server_name outils.mathro.fr;

    root /var/www/outils;
    index index.html;

    # Application monopage : toute route inconnue renvoie index.html,
    # le routeur SvelteKit prend le relais côté navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
